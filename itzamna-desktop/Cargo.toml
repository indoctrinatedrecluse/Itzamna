[package]
name = "itzamna-desktop"
version = "0.1.0"
edition = "2021"
description = "Itzamna — GPU-Accelerated Mayan Git Studio"
authors = ["indoctrinatedrecluse"]
license = "MIT"

[dependencies]
iced = { version = "0.14", features = ["canvas", "tokio", "image", "svg"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.19", features = ["vendored-libgit2"] }
similar = { version = "2.5", features = ["unicode"] }
syntect = "5"
notify = "6"
redb = "2"
