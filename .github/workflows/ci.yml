name: Itzamna Desktop CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-desktop:
    name: Itzamna Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxfixes-dev libgl1-mesa-dev libasound2-dev libudev-dev pkg-config

      - name: Cargo Check
        run: cargo check --bin itzamna-desktop --manifest-path itzamna-desktop/Cargo.toml

      - name: Cargo Test
        run: cargo test --bin itzamna-desktop --manifest-path itzamna-desktop/Cargo.toml

      - name: Release build
        run: cargo build --release --bin itzamna-desktop --manifest-path itzamna-desktop/Cargo.toml
